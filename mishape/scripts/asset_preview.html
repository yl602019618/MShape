<!doctype html><html><head><meta charset="UTF-8"><title>MiShape asset visual validation</title><style>html,body{margin:0;background:#eef1f2;font:14px system-ui}main{display:grid;grid-template-columns:1fr 1fr;height:100vh}.panel{position:relative;min-width:0;height:100vh}h2{position:absolute;z-index:2;top:12px;left:28px;font-size:18px;font-weight:500}.viewport{position:absolute;inset:0}.viewport canvas{width:100%;height:100%;display:block}</style></head><body><main><div class="panel"><h2>Porsche 911 · 930 Turbo</h2><div class="viewport" id="a"></div></div><div class="panel"><h2>Porsche 911 · Carrera 4S</h2><div class="viewport" id="b"></div></div></main><script type="module">import{Viewer}from'../../web/renderer.js';let all=[];for(const[id,key]of[['a','porsche-930'],['b','porsche-carrera-4s']]){let m=await(await fetch(`../assets/${key}/viewport.json`)).json();let v=new Viewer(document.getElementById(id));v.setModel(m);v.radius*=1.20;v.draw();all.push(v)}window.assetViewers=all;document.body.dataset.ready='true';</script></body></html>
